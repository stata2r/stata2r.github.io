name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow the gh-pages deploy step to push the rendered site.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xf typst.tar.xz
          sudo install -m755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install Calepin
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/vincentarelbundock/calepin/releases/latest/download/calepin-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          calepin --version

      - name: Build site
        run: calepin compile . _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          enable_jekyll: false
          force_orphan: true
